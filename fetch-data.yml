name: Generate Cyberpunk Wardrobe Catalog

on:
  schedule:
    - cron: '0 */12 * * *'  # 12 óránként automatikusan frissíti a kínálatot
  workflow_dispatch:        # Kézi indítási lehetőség a GitHub felületéről

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Környezet Beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Függőségek Telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: API Lekérdezések és HTML Generálás
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python scripts/fetch.py

      - name: GitHub Pages Publikálás
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
